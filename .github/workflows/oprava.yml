name: Oprava repa (jednorázově)

# Jednorázový úklid: pryč soubory webu Kine nahrané sem omylem (1. 11. 2026),
# tsconfig.json appky zpátky, appka 0.13.3 ze složky kine-desktop-0.13.3 na
# správné místo. Po doběhnutí tenhle soubor smaž.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  oprava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Uklidit repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d app ] && [ ! -d kine-desktop-0.13.3 ]; then
            echo "Není co opravovat."
            exit 0
          fi
          # 1) Soubory webu Kine, které sem nepatří
          git rm -r -q --ignore-unmatch app components lib NASAZENI-NAVOD.md PRECTI-ME.txt stav-souboru.json \
            supabase-migration-podpory-kontrola.sql supabase-migration-zive-raid-plan-ankety.sql \
            tests/abandonedUploads.test.mjs tests/liveExtras.test.mjs
          # 2) tsconfig.json appky (přepsal ho ten z webu)
          if grep -q 'next-env.d.ts' tsconfig.json; then
            git checkout 1570523 -- tsconfig.json
          fi
          # 3) Appka 0.13.3 ze složky kine-desktop-0.13.3 na správné místo
          if [ -d kine-desktop-0.13.3 ]; then
            cp -r kine-desktop-0.13.3/. .
            git rm -r -q kine-desktop-0.13.3
          fi
          git add -A
          git commit -m "Oprava: pryč omylem nahraný web Kine, appka 0.13.3 na správném místě"
          git push
