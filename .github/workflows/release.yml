name: Vydání
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# Dvě vydání naráz by si přepisovala soubory ve stejném vydání na GitHubu.
concurrency:
  group: vydani
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag podle package.json
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git ls-remote --exit-code --tags origin "$v" >/dev/null 2>&1; then
            echo "tag $v už existuje"
          else
            git tag "$v"
            git push origin "$v"
          fi
      # Adresa pro aktualizace (Cloudflare R2) a podpis - jen když jsou nastavené
      # (Settings -> Secrets and variables -> Actions). Bez nich se vydává jen na GitHub.
      # Dvě appky ze stejného kódu: "Kine" (Kine do PC) a "Kine Clipper".
      - name: Konfigurace vydání (obě appky)
        shell: bash
        run: |
          node scripts/publish-config.mjs
          KINE_VARIANT=clipper node scripts/publish-config.mjs
        env:
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
      # Instalátory se jen staví (--publish never). Nahrání na GitHub dělá níž
      # `gh` - umí opakovat a přepsat, kdežto electron-builder při opakovaném
      # běhu soubor smazal a nový už nenahrál (vydání 0.6.0 zůstalo bez
      # Kine-Setup.exe a latest.yml, appka pak hlásila, že aktualizace nejde
      # zkontrolovat). app-update.yml v appce (odkud se aktualizuje) i
      # latest.yml / clipper.yml vznikají i bez --publish.
      # Do instalátoru jde zmenšený kód bez zdrojových map (scripts/build.mjs, KINE_RELEASE=1) -
      # testy výš běžely nad čitelným sestavením, tohle je to, co se zabalí.
      - name: Sestavení pro vydání (minify)
        run: node scripts/build.mjs
        env:
          KINE_RELEASE: '1'
      - name: Instalátor Kine (Kine do PC)
        run: npx electron-builder --win --x64 --publish never --config electron-builder.generated.yml
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Instalátor Kine Clipper
        run: npx electron-builder --win --x64 --publish never --config electron-builder.clipper.yml
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Kontrola souborů
        shell: bash
        run: |
          set -e
          ls -la release/full release/clipper
          for f in release/full/Kine-Setup.exe release/full/Kine-Setup.exe.blockmap release/full/latest.yml release/clipper/Kine-Clipper-Setup.exe release/clipper/Kine-Clipper-Setup.exe.blockmap; do
            [ -s "$f" ] || { echo "chybí $f"; exit 1; }
          done
          # Kine Clipper hledá na GitHubu clipper.yml (vlastní kanál, ať si appky nepřepisují latest.yml).
          [ -s release/clipper/clipper.yml ] || cp release/clipper/latest.yml release/clipper/clipper.yml
          [ -s release/clipper/latest.yml ] || cp release/clipper/clipper.yml release/clipper/latest.yml
      # Vydání na GitHubu: vznikne, když není; soubory se nahrají s --clobber
      # (přepíšou se), každý až třikrát. Když je tohle hotové, appky mají
      # odkud aktualizovat i bez R2.
      - name: Vydání na GitHubu (obě appky)
        shell: bash
        run: |
          set -e
          v="v$(node -p "require('./package.json').version")"
          if ! gh release view "$v" >/dev/null 2>&1; then
            gh release create "$v" --title "$v" --notes "Kine do PC a Kine Clipper $v. Instalátory: Kine-Setup.exe (Kine do PC), Kine-Clipper-Setup.exe (Kine Clipper)." || echo "vydání už mezitím vzniklo"
          fi
          upload() {
            for i in 1 2 3; do
              if gh release upload "$v" "$@" --clobber; then return 0; fi
              echo "nahrání se nepovedlo (pokus $i), zkouším znovu…"; sleep 15
            done
            return 1
          }
          upload release/full/Kine-Setup.exe release/full/Kine-Setup.exe.blockmap release/full/latest.yml
          upload release/clipper/Kine-Clipper-Setup.exe release/clipper/Kine-Clipper-Setup.exe.blockmap release/clipper/clipper.yml
          gh release view "$v" --json assets --jq '.assets[].name'
          echo "### Vydání $v na GitHubu" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$v" --json assets --jq '.assets[] | "- \(.name) (\(.size) B)"' >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Jen poslední verze ke stažení: starší vydání (a jejich instalátory) se z GitHubu
      # smažou, až je nové kompletně nahrané - starou verzi bez novinek (a bez reklam,
      # až budou) si pak nikdo nestáhne. Značky (tagy) zůstávají kvůli historii kódu.
      # Aktualizace v appkách i web berou vždycky "latest", takže jim nic nechybí.
      - name: Smazat starší vydání (ke stažení jen poslední)
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          count=$(gh release view "$v" --json assets --jq '.assets | length')
          if [ "${count:-0}" -lt 4 ]; then echo "::warning::vydání $v nemá všechny soubory - starší vydání se nechávají"; exit 0; fi
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$old" = "$v" ] && continue
            echo "mažu starší vydání $old"
            gh release delete "$old" --yes || echo "::warning::vydání $old se nepodařilo smazat"
          done
          echo "### Starší vydání smazána - ke stažení zůstává jen $v" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Naše úložiště: Cloudflare R2 (S3 API). Lidi stahují z Kine, ne z GitHubu,
      # a odsud si nainstalované appky berou aktualizace (latest.yml) - každá
      # appka ze své složky (full/, clipper/). Bez klíčů se přeskočí (a řekne to),
      # vydání na GitHubu tím nepadá.
      - name: Nahrát do Cloudflare R2
        if: ${{ vars.DESKTOP_DOWNLOAD_BASE != '' }}
        shell: bash
        run: |
          set -e
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::DESKTOP_DOWNLOAD_BASE je nastavené, ale chybí R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (secrets) - do R2 se nic nenahrálo. Appky si aktualizace vezmou záložně z GitHubu, web stahuje z GitHubu."
            echo "### R2 přeskočeno - chybí klíče (secrets)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          # R2 neumí nové kontrolní součty AWS CLI v2.23+ - vypnout, jinak upload selže.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          put() {
            for i in 1 2 3; do
              if aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$EP" --content-type "$3" --cache-control "$4"; then return 0; fi
              echo "nahrání $2 se nepovedlo (pokus $i), zkouším znovu…"; sleep 10
            done
            return 1
          }
          exe="application/octet-stream"; short="public, max-age=300"
          put release/full/Kine-Setup.exe full/Kine-Setup.exe "$exe" "$short"
          put release/full/Kine-Setup.exe.blockmap full/Kine-Setup.exe.blockmap "$exe" "$short"
          put release/full/latest.yml full/latest.yml text/yaml "no-cache"
          put release/clipper/Kine-Clipper-Setup.exe clipper/Kine-Clipper-Setup.exe "$exe" "$short"
          put release/clipper/Kine-Clipper-Setup.exe.blockmap clipper/Kine-Clipper-Setup.exe.blockmap "$exe" "$short"
          put release/clipper/latest.yml clipper/latest.yml text/yaml "no-cache"
          # Appky do verze 0.4.0 hledají aktualizace v kořeni - dostanou novou Kine (Kine do PC).
          put release/full/Kine-Setup.exe Kine-Setup.exe "$exe" "$short"
          put release/full/Kine-Setup.exe.blockmap Kine-Setup.exe.blockmap "$exe" "$short"
          put release/full/latest.yml latest.yml text/yaml "no-cache"
          put release/clipper/Kine-Clipper-Setup.exe Kine-Clipper-Setup.exe "$exe" "$short"
          echo "nahráno: $DESKTOP_DOWNLOAD_BASE/full/Kine-Setup.exe a $DESKTOP_DOWNLOAD_BASE/clipper/Kine-Clipper-Setup.exe"
          echo "### R2: $DESKTOP_DOWNLOAD_BASE/full/ a $DESKTOP_DOWNLOAD_BASE/clipper/ nahráno" >> "$GITHUB_STEP_SUMMARY"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kine-Setup
          path: |
            release/*/*.exe
            release/*/*.yml

  # Linux (AppImage + deb) a macOS (dmg + zip, univerzální, bez podpisu Apple) ze stejného kódu,
  # obě appky. Běží až po Windows (vydání na GitHubu už existuje) a nahrávají do něj a do R2
  # (stejné složky full/ a clipper/ - electron-updater na Linuxu čte latest-linux.yml vedle latest.yml).
  linux:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Konfigurace vydání (obě appky)
        shell: bash
        run: |
          node scripts/publish-config.mjs
          KINE_VARIANT=clipper node scripts/publish-config.mjs
        env:
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
      - name: Sestavení pro vydání (minify)
        run: node scripts/build.mjs
        env:
          KINE_RELEASE: '1'
      - name: Linux - Kine (Kine do PC)
        run: npx electron-builder --linux --x64 --publish never --config electron-builder.generated.yml
      - name: Linux - Kine Clipper
        run: npx electron-builder --linux --x64 --publish never --config electron-builder.clipper.yml
      - name: Kontrola souborů
        shell: bash
        run: |
          set -e
          ls -la release/full release/clipper
          for f in release/full/Kine-Linux.AppImage release/full/Kine-Linux.deb release/full/latest-linux.yml release/clipper/Kine-Clipper-Linux.AppImage release/clipper/Kine-Clipper-Linux.deb; do
            [ -s "$f" ] || { echo "chybí $f"; exit 1; }
          done
          # Kine Clipper má vlastní kanál (clipper-linux.yml), ať si appky nepřepisují latest-linux.yml.
          [ -s release/clipper/clipper-linux.yml ] || cp release/clipper/latest-linux.yml release/clipper/clipper-linux.yml
      - name: Vydání na GitHubu (Linux)
        shell: bash
        run: |
          set -e
          v="v$(node -p "require('./package.json').version")"
          upload() {
            for i in 1 2 3; do
              if gh release upload "$v" "$@" --clobber; then return 0; fi
              echo "nahrání se nepovedlo (pokus $i), zkouším znovu…"; sleep 15
            done
            return 1
          }
          upload release/full/Kine-Linux.AppImage release/full/Kine-Linux.deb release/full/latest-linux.yml
          upload release/clipper/Kine-Clipper-Linux.AppImage release/clipper/Kine-Clipper-Linux.deb release/clipper/clipper-linux.yml
          echo "### Linux: AppImage + deb nahrané do $v" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Nahrát do Cloudflare R2 (Linux)
        if: ${{ vars.DESKTOP_DOWNLOAD_BASE != '' }}
        shell: bash
        run: |
          set -e
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then echo "::warning::R2 klíče chybí - Linux jen na GitHubu"; exit 0; fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          put() {
            for i in 1 2 3; do
              if aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$EP" --content-type "$3" --cache-control "$4"; then return 0; fi
              echo "nahrání $2 se nepovedlo (pokus $i), zkouším znovu…"; sleep 10
            done
            return 1
          }
          bin="application/octet-stream"; short="public, max-age=300"
          put release/full/Kine-Linux.AppImage full/Kine-Linux.AppImage "$bin" "$short"
          put release/full/Kine-Linux.deb full/Kine-Linux.deb "application/vnd.debian.binary-package" "$short"
          put release/full/latest-linux.yml full/latest-linux.yml text/yaml "no-cache"
          put release/clipper/Kine-Clipper-Linux.AppImage clipper/Kine-Clipper-Linux.AppImage "$bin" "$short"
          put release/clipper/Kine-Clipper-Linux.deb clipper/Kine-Clipper-Linux.deb "application/vnd.debian.binary-package" "$short"
          put release/clipper/latest-linux.yml clipper/latest-linux.yml text/yaml "no-cache"
          echo "### R2: Linux nahrán do full/ a clipper/" >> "$GITHUB_STEP_SUMMARY"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kine-Linux
          path: |
            release/*/*.AppImage
            release/*/*.deb
            release/*/*-linux.yml

  mac:
    runs-on: macos-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Konfigurace vydání (obě appky)
        shell: bash
        run: |
          node scripts/publish-config.mjs
          KINE_VARIANT=clipper node scripts/publish-config.mjs
        env:
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
      - name: Sestavení pro vydání (minify)
        run: node scripts/build.mjs
        env:
          KINE_RELEASE: '1'
      # ffmpeg pro obě architektury Maců: ffmpeg-static stáhne při npm ci jen binárku pro procesor
      # runneru (Apple Silicon), takže univerzální sestavení padalo (@electron/universal neumí
      # spojit dvě stejné binárky) a Intel Mac by dostal špatnou. Stáhnou se obě ze stejného
      # vydání, jaké používá balíček ffmpeg-static, a electron-builder je přibalí podle
      # architektury (scripts/publish-config.mjs: extraResources build/ffmpeg/darwin-${arch}).
      - name: ffmpeg pro Intel i Apple Silicon
        shell: bash
        run: |
          set -e
          tag=$(node -p "require('ffmpeg-static/package.json')['ffmpeg-static']['binary-release-tag']")
          for a in x64 arm64; do
            mkdir -p "build/ffmpeg/darwin-$a"
            for i in 1 2 3; do
              if curl -fsSL "https://github.com/eugeneware/ffmpeg-static/releases/download/$tag/ffmpeg-darwin-$a.gz" | gunzip > "build/ffmpeg/darwin-$a/ffmpeg"; then break; fi
              echo "stažení ffmpeg darwin-$a se nepovedlo (pokus $i)"; sleep 10; [ "$i" = 3 ] && exit 1
            done
            chmod +x "build/ffmpeg/darwin-$a/ffmpeg"
            file "build/ffmpeg/darwin-$a/ffmpeg"
          done
      # Bez podpisu Apple: CSC_IDENTITY_AUTO_DISCOVERY=false, ať electron-builder nehledá certifikát.
      # Zvlášť pro x64 (Intel) a arm64 (Apple Silicon) - jedno spuštění postaví obě a jeden latest-mac.yml.
      - name: macOS - Kine (Kine do PC)
        run: npx electron-builder --mac --x64 --arm64 --publish never --config electron-builder.generated.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: macOS - Kine Clipper
        run: npx electron-builder --mac --x64 --arm64 --publish never --config electron-builder.clipper.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Kontrola souborů
        shell: bash
        run: |
          set -e
          ls -la release/full release/clipper
          for f in release/full/Kine-Mac-x64.dmg release/full/Kine-Mac-arm64.dmg release/full/Kine-Mac-x64.zip release/full/Kine-Mac-arm64.zip release/full/latest-mac.yml \
                   release/clipper/Kine-Clipper-Mac-x64.dmg release/clipper/Kine-Clipper-Mac-arm64.dmg release/clipper/Kine-Clipper-Mac-x64.zip release/clipper/Kine-Clipper-Mac-arm64.zip; do
            [ -s "$f" ] || { echo "chybí $f"; exit 1; }
          done
          # ffmpeg v appce musí odpovídat architektuře: složka mac/ = x64 (x86_64), mac-arm64/ = arm64.
          for dir in release/full release/clipper; do
            x=$(find "$dir/mac" -path "*Resources/ffmpeg/ffmpeg" | head -1); a=$(find "$dir/mac-arm64" -path "*Resources/ffmpeg/ffmpeg" | head -1)
            [ -n "$x" ] && [ -n "$a" ] || { echo "chybí přibalený ffmpeg v $dir"; exit 1; }
            file "$x" | grep -q x86_64 || { echo "ffmpeg v $x není x86_64"; file "$x"; exit 1; }
            file "$a" | grep -q arm64 || { echo "ffmpeg v $a není arm64"; file "$a"; exit 1; }
            # Binárka z node_modules (jen pro procesor runneru) v appce být nesmí.
            if find "$dir/mac" "$dir/mac-arm64" -path "*ffmpeg-static/ffmpeg" | grep -q .; then echo "v appce zůstal ffmpeg z node_modules"; exit 1; fi
          done
          [ -s release/clipper/clipper-mac.yml ] || cp release/clipper/latest-mac.yml release/clipper/clipper-mac.yml
      - name: Vydání na GitHubu (macOS)
        shell: bash
        run: |
          set -e
          v="v$(node -p "require('./package.json').version")"
          upload() {
            for i in 1 2 3; do
              if gh release upload "$v" "$@" --clobber; then return 0; fi
              echo "nahrání se nepovedlo (pokus $i), zkouším znovu…"; sleep 15
            done
            return 1
          }
          upload release/full/Kine-Mac-x64.dmg release/full/Kine-Mac-arm64.dmg release/full/Kine-Mac-x64.zip release/full/Kine-Mac-arm64.zip release/full/latest-mac.yml
          upload release/clipper/Kine-Clipper-Mac-x64.dmg release/clipper/Kine-Clipper-Mac-arm64.dmg release/clipper/Kine-Clipper-Mac-x64.zip release/clipper/Kine-Clipper-Mac-arm64.zip release/clipper/clipper-mac.yml
          echo "### macOS: dmg + zip pro Intel (x64) i Apple Silicon (arm64) nahrané do $v (bez podpisu Apple)" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Nahrát do Cloudflare R2 (macOS)
        if: ${{ vars.DESKTOP_DOWNLOAD_BASE != '' }}
        shell: bash
        run: |
          set -e
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then echo "::warning::R2 klíče chybí - macOS jen na GitHubu"; exit 0; fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          put() {
            for i in 1 2 3; do
              if aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$EP" --content-type "$3" --cache-control "$4"; then return 0; fi
              echo "nahrání $2 se nepovedlo (pokus $i), zkouším znovu…"; sleep 10
            done
            return 1
          }
          bin="application/octet-stream"; short="public, max-age=300"
          for a in x64 arm64; do
            put "release/full/Kine-Mac-$a.dmg" "full/Kine-Mac-$a.dmg" "$bin" "$short"
            put "release/full/Kine-Mac-$a.zip" "full/Kine-Mac-$a.zip" application/zip "$short"
            put "release/clipper/Kine-Clipper-Mac-$a.dmg" "clipper/Kine-Clipper-Mac-$a.dmg" "$bin" "$short"
            put "release/clipper/Kine-Clipper-Mac-$a.zip" "clipper/Kine-Clipper-Mac-$a.zip" application/zip "$short"
          done
          put release/full/latest-mac.yml full/latest-mac.yml text/yaml "no-cache"
          put release/clipper/latest-mac.yml clipper/latest-mac.yml text/yaml "no-cache"
          echo "### R2: macOS nahrán do full/ a clipper/" >> "$GITHUB_STEP_SUMMARY"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kine-Mac
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*-mac.yml
