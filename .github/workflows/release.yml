name: Vydání
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# Dvě vydání naráz by si přepisovala soubory ve stejném vydání na GitHubu.
concurrency:
  group: vydani
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag podle package.json
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git ls-remote --exit-code --tags origin "$v" >/dev/null 2>&1; then
            echo "tag $v už existuje"
          else
            git tag "$v"
            git push origin "$v"
          fi
      # Adresa pro aktualizace (Cloudflare R2) a podpis - jen když jsou nastavené
      # (Settings -> Secrets and variables -> Actions). Bez nich se vydává jen na GitHub.
      # Dvě appky ze stejného kódu: "Kine" (Kine do PC) a "Kine Clipper".
      - name: Konfigurace vydání (obě appky)
        shell: bash
        run: |
          node scripts/publish-config.mjs
          KINE_VARIANT=clipper node scripts/publish-config.mjs
        env:
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
      # Instalátory se jen staví (--publish never). Nahrání na GitHub dělá níž
      # `gh` - umí opakovat a přepsat, kdežto electron-builder při opakovaném
      # běhu soubor smazal a nový už nenahrál (vydání 0.6.0 zůstalo bez
      # Kine-Setup.exe a latest.yml, appka pak hlásila, že aktualizace nejde
      # zkontrolovat). app-update.yml v appce (odkud se aktualizuje) i
      # latest.yml / clipper.yml vznikají i bez --publish.
      - name: Instalátor Kine (Kine do PC)
        run: npx electron-builder --win --x64 --publish never --config electron-builder.generated.yml
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Instalátor Kine Clipper
        run: npx electron-builder --win --x64 --publish never --config electron-builder.clipper.yml
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Kontrola souborů
        shell: bash
        run: |
          set -e
          ls -la release/full release/clipper
          for f in release/full/Kine-Setup.exe release/full/Kine-Setup.exe.blockmap release/full/latest.yml release/clipper/Kine-Clipper-Setup.exe release/clipper/Kine-Clipper-Setup.exe.blockmap; do
            [ -s "$f" ] || { echo "chybí $f"; exit 1; }
          done
          # Kine Clipper hledá na GitHubu clipper.yml (vlastní kanál, ať si appky nepřepisují latest.yml).
          [ -s release/clipper/clipper.yml ] || cp release/clipper/latest.yml release/clipper/clipper.yml
          [ -s release/clipper/latest.yml ] || cp release/clipper/clipper.yml release/clipper/latest.yml
      # Vydání na GitHubu: vznikne, když není; soubory se nahrají s --clobber
      # (přepíšou se), každý až třikrát. Když je tohle hotové, appky mají
      # odkud aktualizovat i bez R2.
      - name: Vydání na GitHubu (obě appky)
        shell: bash
        run: |
          set -e
          v="v$(node -p "require('./package.json').version")"
          if ! gh release view "$v" >/dev/null 2>&1; then
            gh release create "$v" --title "$v" --notes "Kine do PC a Kine Clipper $v. Instalátory: Kine-Setup.exe (Kine do PC), Kine-Clipper-Setup.exe (Kine Clipper)." || echo "vydání už mezitím vzniklo"
          fi
          upload() {
            for i in 1 2 3; do
              if gh release upload "$v" "$@" --clobber; then return 0; fi
              echo "nahrání se nepovedlo (pokus $i), zkouším znovu…"; sleep 15
            done
            return 1
          }
          upload release/full/Kine-Setup.exe release/full/Kine-Setup.exe.blockmap release/full/latest.yml
          upload release/clipper/Kine-Clipper-Setup.exe release/clipper/Kine-Clipper-Setup.exe.blockmap release/clipper/clipper.yml
          gh release view "$v" --json assets --jq '.assets[].name'
          echo "### Vydání $v na GitHubu" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$v" --json assets --jq '.assets[] | "- \(.name) (\(.size) B)"' >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Naše úložiště: Cloudflare R2 (S3 API). Lidi stahují z Kine, ne z GitHubu,
      # a odsud si nainstalované appky berou aktualizace (latest.yml) - každá
      # appka ze své složky (full/, clipper/). Bez klíčů se přeskočí (a řekne to),
      # vydání na GitHubu tím nepadá.
      - name: Nahrát do Cloudflare R2
        if: ${{ vars.DESKTOP_DOWNLOAD_BASE != '' }}
        shell: bash
        run: |
          set -e
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::DESKTOP_DOWNLOAD_BASE je nastavené, ale chybí R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (secrets) - do R2 se nic nenahrálo. Appky si aktualizace vezmou záložně z GitHubu, web stahuje z GitHubu."
            echo "### R2 přeskočeno - chybí klíče (secrets)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          # R2 neumí nové kontrolní součty AWS CLI v2.23+ - vypnout, jinak upload selže.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          put() {
            for i in 1 2 3; do
              if aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$EP" --content-type "$3" --cache-control "$4"; then return 0; fi
              echo "nahrání $2 se nepovedlo (pokus $i), zkouším znovu…"; sleep 10
            done
            return 1
          }
          exe="application/octet-stream"; short="public, max-age=300"
          put release/full/Kine-Setup.exe full/Kine-Setup.exe "$exe" "$short"
          put release/full/Kine-Setup.exe.blockmap full/Kine-Setup.exe.blockmap "$exe" "$short"
          put release/full/latest.yml full/latest.yml text/yaml "no-cache"
          put release/clipper/Kine-Clipper-Setup.exe clipper/Kine-Clipper-Setup.exe "$exe" "$short"
          put release/clipper/Kine-Clipper-Setup.exe.blockmap clipper/Kine-Clipper-Setup.exe.blockmap "$exe" "$short"
          put release/clipper/latest.yml clipper/latest.yml text/yaml "no-cache"
          # Appky do verze 0.4.0 hledají aktualizace v kořeni - dostanou novou Kine (Kine do PC).
          put release/full/Kine-Setup.exe Kine-Setup.exe "$exe" "$short"
          put release/full/Kine-Setup.exe.blockmap Kine-Setup.exe.blockmap "$exe" "$short"
          put release/full/latest.yml latest.yml text/yaml "no-cache"
          put release/clipper/Kine-Clipper-Setup.exe Kine-Clipper-Setup.exe "$exe" "$short"
          echo "nahráno: $DESKTOP_DOWNLOAD_BASE/full/Kine-Setup.exe a $DESKTOP_DOWNLOAD_BASE/clipper/Kine-Clipper-Setup.exe"
          echo "### R2: $DESKTOP_DOWNLOAD_BASE/full/ a $DESKTOP_DOWNLOAD_BASE/clipper/ nahráno" >> "$GITHUB_STEP_SUMMARY"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DESKTOP_DOWNLOAD_BASE: ${{ vars.DESKTOP_DOWNLOAD_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kine-Setup
          path: |
            release/*/*.exe
            release/*/*.yml
