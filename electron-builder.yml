# Balení instalátoru (electron-builder). Windows NSIS: jeden klik,
# instalace pro uživatele (bez správce), zástupce na ploše, po skončení
# se appka rovnou spustí. ffmpeg leží mimo archiv asar, aby šel spustit.
#
# Tohle je základ pro appku "Kine" (Kine do PC). Ve workflow
# (.github/workflows/release.yml) z něj scripts/publish-config.mjs dělá
# dva soubory: electron-builder.generated.yml (Kine) a
# electron-builder.clipper.yml (Kine Clipper - jiný název, ikona, appId,
# adresa aktualizací) a přidá adresu úložiště (Cloudflare R2) a podpis,
# když jsou nastavené. Základ funguje i bez nich (npx electron-builder).
appId: cz.kine.desktop
productName: Kine
copyright: Kine
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  # Pomocník kine-helper.exe jde do resources/helper (extraResources), ne do app.asar.
  - "!dist/helper/**"
  - build/icon.png
  - build/icon-clipper.png
  - build/tray.png
  - package.json
  - "!**/*.map"
asarUnpack:
  - node_modules/ffmpeg-static/**
# Pojistky Electronu (fuses) - běžné zabezpečení zabalené appky: nejde ji spustit jako holý
# Node (ELECTRON_RUN_AS_NODE), nejde do ní připojit ladicí program (--inspect), nečte
# NODE_OPTIONS, kód se bere jen z app.asar a jeho neporušenost se při startu kontroluje
# (Windows, macOS). Cookies vloženého webu Kine šifrované klíčem systému. Platí jen pro
# zabalenou appku (ve vývoji a v testech jede holý Electron). Mac bez podpisu Apple: po
# přepnutí pojistek se obnoví ad-hoc podpis (jinak by Apple Silicon appku nespustil).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
protocols:
  - name: Kine
    schemes: [kine]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Kine-Setup.${ext}
  # Bez podpisu Windows ukáže "neznámý vydavatel", SmartScreen varuje a
  # Inteligentní řízení aplikací (Smart App Control) instalaci zablokuje.
  # Podpis (Certum SimplySign, nebo Azure) přidává workflow přes
  # scripts/podpis.mjs a scripts/publish-config.mjs, když jsou v GitHubu
  # tajemství (JAK-VYDAT.md, část C) - podepíše i všechny .dll a pluginy NSIS.
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  # always = i při přeinstalování se ikona na ploše vytvoří znovu, když chybí
  # (po aktualizaci ji doplní appka sama - src/main/main.ts ensureShortcuts).
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: Kine
  artifactName: Kine-Setup.${ext}
  # Instalátor je jen anglicky (jednojazyčný): vícejazyčný by se řídil
  # jazykem Windows a hráči by ho viděli česky/německy… - appka sama je
  # anglicky s výběrem jazyka v průvodci, tak ať je i instalátor.
  multiLanguageInstaller: false
  language: 1033
# Linux: AppImage (jeden soubor, aktualizuje se sám) a deb (Ubuntu / Mint / Debian).
# macOS: dmg + zip (zip potřebuje electron-updater), zvlášť pro Intel (x64) a Apple
# Silicon (arm64) - univerzální sestavení padalo kvůli ffmpeg (viz publish-config.mjs).
# Názvy souborů a ikony doplňuje scripts/publish-config.mjs.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  maintainer: kinesupport@gmail.com
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.video
  icon: build/icon.png
  # Bez podpisu Apple (vyžaduje Apple Developer účet): macOS appku při prvním otevření
  # odmítne - Nastavení systému -> Soukromí a zabezpečení -> Přesto otevřít (README).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
publish:
  provider: github
  owner: dezfghzdgz
  repo: kine-desktop
  releaseType: release
