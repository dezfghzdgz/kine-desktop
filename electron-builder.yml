# Balení instalátoru (electron-builder). Windows NSIS: jeden klik,
# instalace pro uživatele (bez správce), zástupce na ploše, po skončení
# se appka rovnou spustí. ffmpeg leží mimo archiv asar, aby šel spustit.
#
# Ve workflow (.github/workflows/release.yml) se z tohohle souboru dělá
# electron-builder.generated.yml (scripts/publish-config.mjs): přidá
# adresu pro aktualizace z našeho úložiště (Cloudflare R2) a podpis,
# když jsou nastavené. Tady je základ, který funguje i bez nich.
appId: cz.kine.desktop
productName: Kine
copyright: Kine
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/icon.png
  - build/tray.png
  - package.json
  - "!**/*.map"
asarUnpack:
  - node_modules/ffmpeg-static/**
protocols:
  - name: Kine
    schemes: [kine]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Kine-Setup.${ext}
  # Bez podpisu Windows ukáže "neznámý vydavatel" a SmartScreen varuje.
  # Podpis (Azure Trusted Signing) přidává workflow přes
  # scripts/publish-config.mjs, když jsou v GitHubu tajemství AZURE_*.
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: Kine
  artifactName: Kine-Setup.${ext}
  # build/installer.nsh: zapíše název instalátoru do registru (režim appky).
  installerLanguages: [en_US, cs_CZ, sk_SK, de_DE, pl_PL, es_ES, fr_FR, uk_UA]
  language: 1033
linux:
  target: [dir]
  category: AudioVideo
  icon: build/icon.png
mac:
  target: [dmg]
  category: public.app-category.video
  icon: build/icon.png
publish:
  provider: github
  owner: dezfghzdgz
  repo: kine-desktop
  releaseType: release
