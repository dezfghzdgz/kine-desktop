# Balení instalátoru (electron-builder). Windows NSIS: jeden klik,
# instalace pro uživatele (bez správce), zástupce na ploše, po skončení
# se appka rovnou spustí. ffmpeg leží mimo archiv asar, aby šel spustit.
#
# Tohle je základ pro appku "Kine" (Kine do PC). Ve workflow
# (.github/workflows/release.yml) z něj scripts/publish-config.mjs dělá
# dva soubory: electron-builder.generated.yml (Kine) a
# electron-builder.clipper.yml (Kine Clipper - jiný název, ikona, appId,
# adresa aktualizací) a přidá adresu úložiště (Cloudflare R2) a podpis,
# když jsou nastavené. Základ funguje i bez nich (npx electron-builder).
appId: cz.kine.desktop
productName: Kine
copyright: Kine
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/icon.png
  - build/icon-clipper.png
  - build/tray.png
  - package.json
  - "!**/*.map"
asarUnpack:
  - node_modules/ffmpeg-static/**
protocols:
  - name: Kine
    schemes: [kine]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Kine-Setup.${ext}
  # Bez podpisu Windows ukáže "neznámý vydavatel" a SmartScreen varuje.
  # Podpis (Azure Trusted Signing) přidává workflow přes
  # scripts/publish-config.mjs, když jsou v GitHubu tajemství AZURE_*.
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: Kine
  artifactName: Kine-Setup.${ext}
  # Instalátor je jen anglicky (jednojazyčný): vícejazyčný by se řídil
  # jazykem Windows a hráči by ho viděli česky/německy… - appka sama je
  # anglicky s výběrem jazyka v průvodci, tak ať je i instalátor.
  multiLanguageInstaller: false
  language: 1033
linux:
  target: [dir]
  category: AudioVideo
  icon: build/icon.png
mac:
  target: [dmg]
  category: public.app-category.video
  icon: build/icon.png
publish:
  provider: github
  owner: dezfghzdgz
  repo: kine-desktop
  releaseType: release
